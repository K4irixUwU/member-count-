<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<style>
  :root{
    --ink:#050405; --ash:#cfc8c2; --dim:#8d847f; --red:#c4283a;
    --serif:Georgia,'Times New Roman',serif; --sans:Arial,Helvetica,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:transparent;overflow:hidden;width:256px;height:140px}
  body{display:flex;align-items:center;justify-content:center}

  .card{
    position:relative;width:256px;height:140px;padding:14px 16px 13px;
    display:flex;flex-direction:column;justify-content:space-between;
    background:var(--ink);border:0;border-radius:4px;
    box-shadow:0 12px 32px rgba(0,0,0,.6);color:var(--ash);font-family:var(--sans);overflow:hidden;
  }
  .card::before{
    content:"";position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(ellipse 100% 100% at 10% 0%,rgba(158,27,42,.45),rgba(5,4,5,0) 100%);
  }
  .card > *{position:relative}

  .head{display:flex;align-items:baseline;gap:9px}
  .kanji{font-size:19px;line-height:1;color:var(--red)}
  .title{font-family:var(--serif);font-style:italic;font-size:16px;color:#f3ede8}
  .rule{flex:1;height:1px;align-self:center;background:linear-gradient(90deg,rgba(196,40,58,.7),rgba(196,40,58,0))}

  .num{display:flex;align-items:baseline;gap:8px;font-family:var(--serif)}
  .count{font-size:38px;line-height:1;color:#fbf5ef;text-shadow:0 0 20px rgba(196,40,58,.5)}
  .goal{font-size:14px;color:var(--dim)}

  .track{height:6px;background:#140e10;border:1px solid rgba(255,255,255,.06);border-radius:1px;overflow:hidden}
  .fill{height:100%;width:0;background:linear-gradient(90deg,#7a1220,#c4283a 70%,#e8606f);
        box-shadow:0 0 10px rgba(196,40,58,.7);transition:width 1s ease}

  .foot{display:flex;justify-content:space-between;font-size:11px;color:var(--dim);letter-spacing:.3px}
  @media (prefers-reduced-motion:reduce){.fill{transition:none}}
</style>
</head>
<body>

<div class="card" role="group" aria-label="ShiroKuro member count">
  <div class="head">
    <span class="kanji" aria-hidden="true">衆</span>
    <span class="title">Members</span>
    <span class="rule"></span>
  </div>

  <div class="num">
    <span class="count" id="count">…</span>
    <span class="goal">of <span id="goal">2,000</span></span>
  </div>

  <div>
    <div class="track" role="progressbar" aria-valuemin="0" aria-valuemax="100" id="track">
      <div class="fill" id="bar"></div>
    </div>
    <div class="foot" style="margin-top:7px">
      <span id="pct">&nbsp;</span>
      <span id="left">&nbsp;</span>
    </div>
  </div>
</div>

<script>
const GOAL = 2000;
const $ = id => document.getElementById(id);
document.getElementById("goal").textContent = GOAL.toLocaleString();

async function loadCount(){
  try{
    const res = await fetch("https://api.chess.com/pub/club/shirokuro");
    if (!res.ok) throw new Error(res.status);
    const data = await res.json();
    const count = Number(data.members_count);
    if (!Number.isFinite(count)) throw new Error("no count");

    const percent = Math.min(count / GOAL * 100, 100);
    $("count").textContent = count.toLocaleString();
    $("bar").style.width = percent + "%";
    $("track").setAttribute("aria-valuenow", Math.round(percent));
    $("pct").textContent = Math.floor(percent) + "% of the way";
    $("left").textContent = count >= GOAL ? "Goal reached" : (GOAL - count).toLocaleString() + " to go";
  }catch(e){
    $("count").textContent = "—";
    $("pct").textContent = "Count unavailable";
  }
}

loadCount();
setInterval(loadCount, 600000);
</script>
</body>
</html>
